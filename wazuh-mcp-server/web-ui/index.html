<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazuh AI Security Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-message {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        /* Markdown styles */
        .prose pre {
            background-color: #1e293b;
            padding: 1em;
            border-radius: 0.5em;
            overflow-x: auto;
        }
        .prose code {
            color: #e2e8f0;
            background-color: #334155;
            padding: 0.2em 0.4em;
            border-radius: 0.25em;
            font-size: 0.875em;
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
        }
        .prose h3 {
            color: #e2e8f0;
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }
        .prose p {
            margin-bottom: 0.75em;
        }
        .prose ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 0.75em;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-shield-alt text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold">Wazuh AI Security Agent</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-sm text-gray-400">System Online</span>
                </div>
                <button id="settingsBtn" class="text-gray-400 hover:text-white">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 container mx-auto p-4 overflow-hidden flex flex-col">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800">
            <!-- Welcome Message -->
            <div class="chat-message flex items-start space-x-3">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white"></i>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 max-w-3xl shadow-md border border-gray-700">
                    <p>您好！我是您的智能安全运营助理。我已经连接到 Wazuh 环境，可以协助您进行安全监控、威胁分析和资产管理。</p>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button class="quick-action text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-full transition-colors" onclick="sendQuickAction('列出所有在线 Agent')">
                            <i class="fas fa-desktop mr-1"></i>在线 Agent
                        </button>
                        <button class="quick-action text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-full transition-colors" onclick="sendQuickAction('查询最近的高危告警')">
                            <i class="fas fa-exclamation-triangle mr-1"></i>高危告警
                        </button>
                        <button class="quick-action text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-full transition-colors" onclick="sendQuickAction('生成今日安全日报')">
                            <i class="fas fa-file-alt mr-1"></i>安全日报
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-gray-800 rounded-xl p-2 border border-gray-700 shadow-lg">
            <div class="flex items-center space-x-2">
                <textarea id="userInput" rows="1" class="flex-1 bg-transparent text-white p-3 focus:outline-none resize-none" placeholder="输入您的指令，例如：查询 Agent 001 的漏洞信息..." onkeydown="handleKeyDown(event)"></textarea>
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-xl p-6 w-96 border border-gray-700 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">设置</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">DeepSeek API Key</label>
                    <input type="password" id="apiKeyInput" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:border-blue-500 focus:outline-none" placeholder="sk-...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Model</label>
                    <select id="modelSelect" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:border-blue-500 focus:outline-none">
                        <option value="deepseek-chat">deepseek-chat</option>
                        <option value="deepseek-coder">deepseek-coder</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeSettings()" class="px-4 py-2 text-gray-400 hover:text-white transition-colors">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors">保存</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        let config = {
            apiKey: localStorage.getItem('deepseek_api_key') || 'sk-65c32cee8b21420cb072b20ecf53e860',
            model: localStorage.getItem('deepseek_model') || 'deepseek-chat'
        };

        // DOM Elements
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');

        // Initialize
        document.getElementById('apiKeyInput').value = config.apiKey;
        document.getElementById('modelSelect').value = config.model;

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value === '') this.style.height = 'auto';
        });

        // Event Listeners
        settingsBtn.onclick = () => settingsModal.classList.remove('hidden');
        settingsModal.onclick = (e) => {
            if (e.target === settingsModal) closeSettings();
        };

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            const newKey = document.getElementById('apiKeyInput').value;
            const newModel = document.getElementById('modelSelect').value;
            
            if (newKey) {
                config.apiKey = newKey;
                localStorage.setItem('deepseek_api_key', newKey);
            }
            config.model = newModel;
            localStorage.setItem('deepseek_model', newModel);
            
            closeSettings();
            addSystemMessage('设置已更新');
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendQuickAction(text) {
            userInput.value = text;
            sendMessage();
        }

        function addMessage(content, type) {
            const div = document.createElement('div');
            div.className = 'chat-message flex items-start space-x-3 ' + (type === 'user' ? 'justify-end' : '');
            
            const icon = type === 'user' ? 'fa-user' : 'fa-robot';
            const bgClass = type === 'user' ? 'bg-blue-600' : 'bg-gray-800';
            const iconBg = type === 'user' ? 'bg-gray-700' : 'bg-blue-600';
            
            // Render Markdown for AI responses
            const htmlContent = type === 'ai' ? marked.parse(content) : content;

            const innerHTML = `
                ${type === 'ai' ? `
                <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">
                    <i class="fas ${icon} text-white"></i>
                </div>` : ''}
                <div class="${bgClass} rounded-lg p-4 max-w-3xl shadow-md border border-gray-700 prose prose-invert max-w-none">
                    ${htmlContent}
                </div>
                ${type === 'user' ? `
                <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">
                    <i class="fas ${icon} text-white"></i>
                </div>` : ''}
            `;
            
            div.innerHTML = innerHTML;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div; // Return the message element for updates
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex justify-center my-2';
            div.innerHTML = `<span class="text-xs text-gray-500 bg-gray-800 px-3 py-1 rounded-full">${text}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            
            // Disable send button
            sendBtn.disabled = true;

            // Add user message
            addMessage(text, 'user');

            // Add loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'chat-message flex items-start space-x-3';
            loadingDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white"></i>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 shadow-md border border-gray-700">
                    <div class="flex items-center space-x-2 text-gray-400">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <span class="loading-dots">思考中</span>
                    </div>
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': config.apiKey
                    },
                    body: JSON.stringify({
                        message: text,
                        model: config.model
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                // Handle streaming response
                chatBox.removeChild(loadingDiv);
                
                // Create a container for the AI message that we'll update
                const aiMessageDiv = addMessage('', 'ai');
                const contentDiv = aiMessageDiv.querySelector('.prose');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices[0].delta.content || '';
                                fullContent += content;
                                contentDiv.innerHTML = marked.parse(fullContent);
                                chatBox.scrollTop = chatBox.scrollHeight;
                            } catch (e) {
                                console.error('Error parsing chunk:', e);
                            }
                        }
                    }
                }

            } catch (error) {
                chatBox.removeChild(loadingDiv);
                addSystemMessage(`Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
